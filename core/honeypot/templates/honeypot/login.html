{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log in | Django Admin</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.1/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-F3w7mX95PdgyTmZZMECAngseQB83DfGTowi0iMjiWaeVhAn4FJkqJByhZMI3AhiU"
      crossorigin="anonymous"
    />
    <meta name="robots" content="NONE,NOARCHIVE" />
  </head>

  <body
    style="
      background: #fbfbfd;
      font-family:
        -apple-system, BlinkMacSystemFont, &quot;SF Pro Display&quot;,
        &quot;Segoe UI&quot;, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    "
  >
    <header
      class="py-3"
      style="
        background: rgba(255, 255, 255, 0.8);
        backdrop-filter: blur(20px);
        border-bottom: 1px solid #d2d2d7;
      "
    >
      <div class="container">
        <div
          class="d-flex flex-wrap align-items-center justify-content-between"
        >
          <a
            href="/"
            class="d-flex align-items-center text-decoration-none"
            style="color: #1d1d1f; font-size: 1.25rem; font-weight: 600"
          >
            Django HoneyPot
          </a>

          <ul class="nav d-flex gap-1 mb-0">
            <li>
              <a
                href="/secret-admin-entrance"
                class="nav-link px-3"
                style="color: #1d1d1f"
                >Admin</a
              >
            </li>
            <li>
              <a href="/admin" class="nav-link px-3" style="color: #ff3b30"
                >HoneyPot</a
              >
            </li>
            <li>
              <a href="/" class="nav-link px-3" style="color: #1d1d1f">Home</a>
            </li>
          </ul>
        </div>
      </div>
    </header>

    <div
      class="container flex-grow-1 d-flex align-items-center justify-content-center py-5"
    >
      <div class="col-md-5 col-lg-4">
        <div
          class="card shadow-sm"
          style="
            border: 1px solid #d2d2d7;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
          "
        >
          <div class="card-body p-5">
            <h2
              class="text-center mb-4"
              style="color: #1d1d1f; font-weight: 600"
            >
              🍯 Admin Login
            </h2>

            {% if messages %}
            <div class="alert alert-danger" role="alert">
              {% for message in messages %} {{ message }} {% endfor %}
            </div>
            {% endif %}

            <form action="/admin/login/" method="post">
              {% csrf_token %}
              <div class="mb-3">
                <label
                  for="id_username"
                  class="form-label"
                  style="color: #1d1d1f; font-weight: 500"
                >
                  Email address
                </label>
                <input
                  type="email"
                  class="form-control"
                  name="username"
                  autofocus
                  autocapitalize="none"
                  autocomplete="username"
                  maxlength="254"
                  required
                  id="id_username"
                  style="
                    border: 1px solid #d2d2d7;
                    border-radius: 8px;
                    padding: 12px;
                  "
                />
              </div>
              <div class="mb-4">
                <label
                  for="id_password"
                  class="form-label"
                  style="color: #1d1d1f; font-weight: 500"
                >
                  Password
                </label>
                <input
                  type="password"
                  class="form-control"
                  name="password"
                  autocomplete="current-password"
                  required
                  id="id_password"
                  style="
                    border: 1px solid #d2d2d7;
                    border-radius: 8px;
                    padding: 12px;
                  "
                />
                <input type="hidden" name="next" value="/admin/" />
              </div>
              <button
                type="submit"
                class="btn btn-primary w-100"
                style="
                  background: #007aff;
                  border: none;
                  border-radius: 8px;
                  padding: 12px;
                  font-weight: 600;
                  font-size: 16px;
                "
              >
                Log in
              </button>
            </form>
          </div>
        </div>
        <p class="text-center mt-3" style="color: #86868b; font-size: 14px">
          This is a honeypot login. Attempts are monitored.
        </p>
      </div>
    </div>

    <div class="container mt-auto">
      <footer
        class="d-flex flex-wrap justify-content-center align-items-center py-3 my-4 border-top"
      >
        <span class="text-muted">© 2026 Django Admin HoneyPot</span>
      </footer>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.1/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-/bQdsTh/da6pkI1MST/rWKFNjaCP5gBSY4sEBT38Q/9RBh9AH40zEOg7Hlq2THRZ"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
